[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pylibhmm"
version = "0.12.1"
description = "Python bindings for libhmm v4 — scalar and multivariate HMMs with NumPy-friendly distributions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# ruff is pinned directly in ci.yml (not sourced from here) so its version
# bump stays deliberate there; mypy is listed here too for local dev parity
# with the CI pin (see ci.yml's lint job).
lint = ["mypy==2.3.1"]

[tool.scikit-build]
# Build one CPython Stable ABI (abi3) wheel covering 3.12 and every later
# version, instead of a separate wheel per interpreter. scikit-build-core turns
# this off by itself where the limited API does not apply — on PyPy and on
# free-threaded builds — so those still produce ordinary version-specific
# wheels with no extra config. requires-python is >=3.12, so unlike pylibstats
# there is no sub-target interpreter to fall back for.
#
# REQUIRES the ${SKBUILD_SABI_COMPONENT} argument on find_package(Python) in
# CMakeLists.txt. This setting only TAGS the wheel abi3; it does not verify one
# was built. Without that argument the Python::SABIModule target never exists,
# nanobind silently drops STABLE_ABI, and the result is a wheel tagged
# cp312-abi3 containing a python312-linked binary that cannot import anywhere
# but 3.12. Nothing warns at any layer, and CI cannot catch it on its own:
# cibuildwheel tests each wheel on the interpreter that built it, the one
# version where the broken form works. Do not set one without the other.
wheel.py-api = "cp312"
cmake.build-type = "Release"
wheel.packages = ["src/pylibhmm"]
editable.mode = "redirect"

[tool.pyright]
# Point the language server at the project venv so numpy and the editable
# install resolve. Only affects editors/agents; CI does not run pyright.
venvPath = "."
venv = ".venv"
# _core is a compiled extension with a hand-written .pyi and no .py source.
reportMissingModuleSource = false

[tool.mypy]
# `files` must name the .py file explicitly, not the `src/pylibhmm`
# directory: __init__.pyi sits next to __init__.py, and mypy's stub-shadowing
# rule means a directory/package target resolves to the .pyi and silently
# skips checking the .py body. Passing the .py path directly (like a CLI
# argument) is what forces mypy to actually check the implementation.
files = ["src/pylibhmm/__init__.py"]
python_version = "3.12"  # matches requires-python's floor
# Not full `strict`: strict also wants disallow_untyped_calls,
# disallow_any_generics, no_implicit_reexport, etc., which would ripple into
# every _core.pyi call site for limited benefit right now. These five options
# are the ones that directly serve issue #16 (require and check annotations)
# plus common footguns (silent Any returns, stale ignores, no-op casts).
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=./.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# "B" (flake8-bugbear) adopted at 0.12.0: the former B017 findings were
# triaged — every flagged site raises the nanobind translation of
# std::invalid_argument, i.e. ValueError, and the tests now assert that.
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Stub files keep idiomatic single-line signatures; wrapping them for a
# line-length rule would hurt readability of the API surface, not help it.
"*.pyi" = ["E501"]
