name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # Monthly canary: catches drift with no code change to trigger it (Python
  # release cycle, runner image rolls, stale libhmm pin) instead of
  # discovering breakage at the next real push.
  schedule:
    - cron: '20 3 1 * *'
  # Lets the canary-only jobs (pin-currency) be run on demand without
  # waiting for the monthly cron.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # All 3 Python versions on Linux (cheap); macOS/Windows only test the
        # oldest+newest supported version — the version axis rarely diverges
        # by OS for a nanobind extension, and macOS/Windows runners cost
        # 10x/2x Linux minutes on private repos.
        include:
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: ubuntu-latest,  python: "3.14" }
          - { os: macos-latest,   python: "3.12" }
          - { os: macos-latest,   python: "3.14" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build and install
        run: pip install ".[test]" -v

      - name: Run tests
        run: pytest tests -v --tb=short

  # ---------------------------------------------------------------------------
  # ASan+UBSan run together in this one job (same runner, no extra cost) —
  # builds the extension with -fsanitize=address,undefined and runs pytest
  # under both via LD_PRELOAD.  Linux/GCC only: macOS ASan for Python
  # extensions requires DYLD_INSERT_LIBRARIES and SIP workarounds.
  # detect_leaks=0: CPython's memory allocator produces false positives.
  # Would have caught the calculator UAF (Finding 1) in the extension layer.
  # ---------------------------------------------------------------------------
  asan:
    name: ASan/UBSan (ubuntu / Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build extension with ASan+UBSan (libhmm + extension both instrumented)
        run: |
          # CMAKE_CXX_FLAGS propagates to the libhmm add_subdirectory build so
          # the entire C++ call stack is uniformly ASan/UBSan-instrumented.  Do
          # NOT set CMAKE_SHARED_LINKER_FLAGS: GCC already links libasan.so
          # automatically via -fsanitize=address; double-specifying causes
          # conflicts at dlopen time.
          pip install ".[test]" \
            -Ccmake.define.CMAKE_CXX_FLAGS="-fsanitize=address,undefined -g -O1 -fno-omit-frame-pointer"

      - name: Run tests under ASan+UBSan
        run: |
          LIBASAN=$(gcc -print-file-name=libasan.so)
          LIBSTDCXX=$(gcc -print-file-name=libstdc++.so.6)
          # Root cause of previous failures: libasan.so is a DT_NEEDED of
          # _core.so, so when LD_PRELOAD loads libasan first, libstdc++ is not
          # yet loaded.  ASan's __cxa_throw interceptor gets
          # real___cxa_throw = nullptr, causing CHECK failed in
          # asan_interceptors.cpp:320 on any C++ exception.
          # Fix: preload libstdc++ before libasan so the real symbol is resolved
          # before ASan wraps it.  verify_asan_link_order=0 suppresses the
          # "ASan runtime does not come first" warning that follows.
          LD_PRELOAD="$LIBSTDCXX $LIBASAN" \
            PYTHONMALLOC=malloc \
            ASAN_OPTIONS=detect_leaks=0:alloc_dealloc_mismatch=0:verify_asan_link_order=0 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            pytest tests -v --tb=short

  # ---------------------------------------------------------------------------
  # pin-currency — canary-only (monthly cron / manual dispatch), not on push
  # or PR: this asks "is the pin still the RIGHT tag?", which is a different
  # question from "does the pinned tag still build?".  The latter is already
  # covered on every run, because CI has no ../libhmm sibling and so always
  # takes the FetchContent branch.  Nothing covered the former until now —
  # the pin could silently fall behind a libhmm release indefinitely
  # (GitHub issue #15).
  #
  # On mismatch this fails deliberately.  Bumping GIT_TAG is not mechanical:
  # any libhmm release carrying the LIBHMM_* option rename also requires
  # deleting the seven forced set(... FORCE) lines in the FetchContent
  # branch of CMakeLists.txt.  See PLAN.md Cross-Repo Dependencies.
  # ---------------------------------------------------------------------------
  pin-currency:
    name: libhmm pin currency (canary)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pinned libhmm tag against newest libhmm release
        env:
          LIBHMM_REPO: https://github.com/OldCrow/libhmm.git
        run: |
          set -euo pipefail

          # '|| true' on both lookups: under 'set -e' a failed command
          # substitution aborts the step immediately, which would skip the
          # explicit checks below and emit no actionable ::error:: message.
          pin=$(grep -oE '^[[:space:]]*GIT_TAG[[:space:]]+v[^[:space:]]+' CMakeLists.txt \
                | awk '{print $2}' || true)
          if [ -z "${pin}" ]; then
            echo "::error::could not parse GIT_TAG from CMakeLists.txt"
            exit 1
          fi

          latest=$(git ls-remote --tags --refs "${LIBHMM_REPO}" 'v*' \
                   | sed 's|.*refs/tags/||' | sort -V | tail -1 || true)
          if [ -z "${latest}" ]; then
            echo "::error::could not resolve newest libhmm tag from ${LIBHMM_REPO}"
            exit 1
          fi

          echo "pinned: ${pin}"
          echo "latest: ${latest}"

          if [ "${pin}" != "${latest}" ]; then
            echo "::error::libhmm pin is stale — pinned ${pin}, newest release ${latest}. \
          Bump GIT_TAG in CMakeLists.txt; if the new tag carries the LIBHMM_* option \
          rename, also delete the forced set(... FORCE) lines in the FetchContent branch."
            exit 1
          fi
          echo "pin is current"
